name: Macuum Cleaner
options:
  bundleIdPrefix: com.macuum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MacuumCore:
    path: Packages/MacuumCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
targets:
  Macuum Cleaner:
    type: application
    platform: macOS
    sources:
      - path: Macuum Cleaner
        excludes:
          - Info.plist
    dependencies:
      - package: MacuumCore
    info:
      path: Macuum Cleaner/Info.plist
      properties:
        CFBundleDisplayName: Macuum Cleaner
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © Macuum Cleaner
    entitlements:
      path: Macuum Cleaner/Macuum Cleaner.entitlements
      properties:
        com.apple.security.cs.allow-dyld-environment-variables: false
        com.apple.security.cs.disable-library-validation: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macuum.cleaner
        PRODUCT_NAME: Macuum Cleaner
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
